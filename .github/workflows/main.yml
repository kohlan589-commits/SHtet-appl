name: Build SHtet App APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Java Setup (Flutter အတွက် လိုအပ်သည်)
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      # Flutter SDK Setup (Latest Stable Version)
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      # Dependencies များကို ယူခြင်း
      - run: flutter pub get

      # Release APK ဖိုင် တည်ဆောက်ခြင်း (Build APK)
      - run: flutter build apk --release

      # ထွက်လာသည့် APK ဖိုင်ကို GitHub Actions Artifact အဖြစ် သိမ်းဆည်းပေးခြင်း
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
